[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "sros-audit"
version = "0.1.0"
description = "Read-only Nokia SR OS inspection prototype"
requires-python = ">=3.10"
dependencies = []
[project.optional-dependencies]
ssh = ["paramiko>=3.4,<5"]
[project.scripts]
sros-audit = "sros_audit.cli:main"
[tool.setuptools.packages.find]
include = ["sros_audit*"]
